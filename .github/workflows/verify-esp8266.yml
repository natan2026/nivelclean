name: Verificar firmware ESP8266
on:
  push:
    branches: [main]
    paths:
      - 'firmware/nivelclean_esp8266/**'
      - 'esp8266/**'
      - '.github/workflows/verify-esp8266.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar core ESP8266 e ArduinoJson
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install 'ArduinoJson@7.4.2'
      - name: Compilar NodeMCU
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 firmware/nivelclean_esp8266
      - name: Verificar calculo e estados do painel
        run: node --test esp8266/tests/model.test.mjs
