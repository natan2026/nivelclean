name: Verificar NivelClean
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - core: esp8266:esp8266@3.1.2
            fqbn: esp8266:esp8266:nodemcuv2
            path: firmware/nivelclean_esp8266
          - core: esp32:esp32@3.3.2
            fqbn: esp32:esp32:esp32s3
            path: firmware/nivelclean_simulacao
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar ferramentas Arduino
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install '${{ matrix.core }}'
          arduino-cli lib install 'ArduinoJson@7.4.2' 'LiquidCrystal I2C@1.1.2'
      - run: arduino-cli compile --fqbn '${{ matrix.fqbn }}' '${{ matrix.path }}'
  logic-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:rules
