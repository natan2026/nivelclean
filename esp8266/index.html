<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f8c">
  <meta name="description" content="Monitoramento em tempo real do nível e da qualidade da água."><title>Nível Clean 2026</title>
  <style>
    :root{color-scheme:dark;--bg:#061a22;--cyan:#45d5e6;--green:#58e09b;--yellow:#ffd166;--red:#ff6b6b;--muted:#99b8c2}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#0d3b49 0,#061a22 52%);color:#f5fbfd}main{width:min(100% - 32px,880px);margin:auto;padding:32px 0 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}h1{margin:0;font-size:clamp(1.65rem,5vw,2.65rem)}.subtitle{margin:6px 0 0;color:var(--muted)}
    .live{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #24505c;border-radius:999px;color:var(--muted);white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px currentColor}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:linear-gradient(145deg,rgba(16,56,68,.96),rgba(8,35,44,.96));border:1px solid #1e4b57;border-radius:22px;padding:24px;box-shadow:0 18px 45px rgba(0,0,0,.25)}
    .label{color:var(--muted);font-size:.92rem;text-transform:uppercase;letter-spacing:.08em}.value{margin:9px 0 5px;font-size:clamp(2.3rem,9vw,4.5rem);font-weight:800;line-height:1;color:var(--cyan)}.unit{font-size:1.1rem;color:var(--muted)}.status{display:inline-flex;margin-top:18px;padding:8px 12px;border-radius:999px;background:#153e48;font-weight:750}
    .tank{height:210px;border:4px solid #bdebf1;border-radius:18px 18px 28px 28px;overflow:hidden;position:relative;background:#09242d;margin-top:18px}.water{position:absolute;inset:auto 0 0;height:0;background:linear-gradient(#4be0ee,#078fa7);transition:height .8s ease}.water:before{content:"";position:absolute;top:-8px;left:-5%;width:110%;height:16px;border-radius:50%;background:#72edf5;opacity:.8}
    .quality{display:flex;align-items:center;gap:12px;margin-top:24px}.quality-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:#123d48;font-size:1.7rem}.error{margin-top:18px;padding:14px 16px;border-radius:14px;background:#4b2428;color:#ffd8d8;display:none}footer{text-align:center;color:var(--muted);margin-top:25px;font-size:.9rem}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><h1>Nível Clean 2026</h1><p class="subtitle">Monitoramento da caixa d’água em tempo real</p></div><div class="live"><span class="dot" id="dot"></span><span id="connection">Conectando…</span></div></header>
  <section class="grid">
    <article class="card"><div class="label">Nível da caixa</div><div class="value"><span id="nivel">--</span><span class="unit">%</span></div><div><span id="litros">--</span> litros de 5,00 L</div><div class="tank"><div class="water" id="water"></div></div><div class="status" id="statusNivel">Aguardando dados</div></article>
    <article class="card"><div class="label">Qualidade da água</div><div class="value"><span id="tds">--</span><span class="unit"> ppm</span></div><div>Leitura do sensor TDS</div><div class="quality"><div class="quality-icon" id="qualityIcon">💧</div><div><div class="label">Situação</div><div class="status" id="qualidade">Aguardando dados</div></div></div></article>
  </section><div class="error" id="error"></div><footer>Última atualização nesta tela: <span id="updated">—</span></footer>
</main>
<script type="module">
  import{initializeApp}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
  const cfg={apiKey:"AIzaSyBcvtFYLnyjoVOFQxAXR-bu6dJhtITGe0Y",authDomain:"nivelclean2026.firebaseapp.com",databaseURL:"https://nivelclean2026-default-rtdb.firebaseio.com",projectId:"nivelclean2026",storageBucket:"nivelclean2026.firebasestorage.app",messagingSenderId:"189322688269",appId:"1:189322688269:web:8d738c1ad78fd52ec8e244"};
  const $=id=>document.getElementById(id),connection=(t,c)=>{$("connection").textContent=t;$("dot").style.background=c},fail=m=>{$("error").textContent=m;$("error").style.display="block"};
  try{const app=initializeApp(cfg);await signInAnonymously(getAuth(app));onValue(ref(getDatabase(app),"medicoes"),s=>{if(!s.exists()){connection("Aguardando ESP32","#ffd166");return}const d=s.val(),n=Math.max(0,Math.min(100,Number(d.nivel)||0));$("nivel").textContent=n.toFixed(1).replace(".",",");$("litros").textContent=(Number(d.litros)||0).toFixed(2).replace(".",",");$("tds").textContent=(Number(d.tds)||0).toFixed(1).replace(".",",");$("water").style.height=n+"%";const baixo=d.statusNivel==="NIVEL_BAIXO";$("statusNivel").textContent=baixo?"CAIXA: NÍVEL BAIXO":"CAIXA: NÍVEL OK";$("statusNivel").style.color=baixo?"#ffd166":"#58e09b";const suja=d.qualidadeAgua==="AGUA_SUJA";$("qualidade").textContent=suja?"ÁGUA SUJA":"ÁGUA LIMPA";$("qualidade").style.color=suja?"#ff6b6b":"#58e09b";$("qualityIcon").textContent=suja?"⚠️":"💧";$("updated").textContent=new Date().toLocaleString("pt-BR");connection("Ao vivo","#58e09b");$("error").style.display="none"},e=>{connection("Sem conexão","#ff6b6b");fail("Erro ao ler o Firebase: "+e.message)})}catch(e){connection("Sem conexão","#ff6b6b");fail("Erro ao iniciar o painel: "+e.message)}
</script></body></html>
